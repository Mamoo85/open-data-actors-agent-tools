[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "open-data-actors-tools"
version = "0.1.0"
description = "LangChain, LlamaIndex and CrewAI tools for 29 public open-data Apify actors (sanctions, SEC Form D, FMCSA, permits, jobs, domains and more)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Mamoo85" }]
keywords = ["langchain", "llamaindex", "crewai", "apify", "ai-agents", "agent-tools", "open-data", "lead-generation"]
dependencies = ["apify-client>=1.8", "pydantic>=2.5"]

[project.optional-dependencies]
langchain = ["langchain-core>=0.2"]
llamaindex = ["llama-index-core>=0.10"]
crewai = ["crewai>=0.80"]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://mamoo85.github.io/open-data-actors/"
Repository = "https://github.com/Mamoo85/open-data-actors-agent-tools"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
open_data_actors = ["registry.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
